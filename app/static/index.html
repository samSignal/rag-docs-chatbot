<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Docs Chatbot</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec; --accent:#2f5bea; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #docs span { display:inline-block; background:#eef2ff; border-radius:999px; padding:2px 10px; margin:4px 4px 0 0; font-size:13px; }
  .msg { margin-top:14px; }
  .q { font-weight:600; }
  .a { white-space:pre-wrap; margin-top:4px; }
  details { margin-top:6px; font-size:13px; color:var(--muted); }
  details div { border-left:3px solid var(--line); padding:4px 8px; margin:6px 0; }
</style>
</head>
<body>
<main>
  <h1>RAG Docs Chatbot</h1>
  <div class="muted" id="status">Loading…</div>

  <section class="card">
    <div class="row">
      <input type="file" id="file" accept=".pdf,.txt,.md">
      <button id="upload">Upload &amp; index</button>
    </div>
    <div id="docs" class="muted"></div>
  </section>

  <section class="card">
    <form class="row" id="askForm">
      <input type="text" id="question" placeholder="Ask a question about your documents…" autocomplete="off">
      <button id="askBtn">Ask</button>
    </form>
    <div id="chat"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function refresh() {
  const h = await (await fetch('/health')).json();
  $('status').textContent = `LLM: ${h.llm} · Embeddings: ${h.embedder} · ${h.chunks} chunks indexed`;
  const d = await (await fetch('/documents')).json();
  $('docs').innerHTML = d.documents.length
    ? d.documents.map(x => `<span>${esc(x.name)} (${x.chunks})</span>`).join('')
    : 'No documents yet.';
}

$('upload').onclick = async () => {
  const f = $('file').files[0];
  if (!f) return;
  $('upload').disabled = true;
  const body = new FormData(); body.append('file', f);
  const r = await fetch('/documents', { method: 'POST', body });
  if (!r.ok) alert((await r.json()).detail);
  $('upload').disabled = false; $('file').value = '';
  refresh();
};

$('askForm').onsubmit = async (e) => {
  e.preventDefault();
  const q = $('question').value.trim();
  if (!q) return;
  $('askBtn').disabled = true;
  const r = await fetch('/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ question: q }) });
  const a = await r.json();
  const src = (a.sources || []).map(s =>
    `<div><b>[${s.ref}] ${esc(s.source)}, p.${s.page}</b> (score ${s.score})<br>${esc(s.text.slice(0, 300))}…</div>`).join('');
  $('chat').insertAdjacentHTML('afterbegin',
    `<div class="msg"><div class="q">${esc(q)}</div><div class="a">${esc(a.answer || a.detail)}</div>` +
    (src ? `<details><summary>Sources (${a.sources.length}) · ${a.latency_ms} ms</summary>${src}</details>` : '') + `</div>`);
  $('question').value = ''; $('askBtn').disabled = false;
};

refresh();
</script>
</body>
</html>
